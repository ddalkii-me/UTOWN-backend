name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Cancel superseded runs for the same branch / PR to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` runs unit + integration tests and generates the JaCoCo report.
      # Docker is available on ubuntu-latest, so Testcontainers-based tests run here.
      - name: Build and run tests
        run: ./mvnw -B -ntp verify

      - name: Publish test summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for path in glob.glob("target/surefire-reports/TEST-*.xml"):
              r = ET.parse(path).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0))
              e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
          status = "✅" if f + e == 0 and t > 0 else "❌"
          print(f"### {status} Test results\n")
          print("| Total | Passed | Failed | Errors | Skipped |")
          print("|---|---|---|---|---|")
          print(f"| {t} | {t - f - e - s} | {f} | {e} | {s} |")
          EOF

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Validates the Dockerfile builds; the image is not pushed anywhere.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: utown-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
